<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOTTA.SCAN</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>GOTTA<span class="accent">.SCAN</span></h1>
      <p class="muted">Local scan pipeline — photos → mesh → exports + measurements.
        Everything runs on this Mac; no server required.</p>

      <h3>Reconstruct from photos (Swift)</h3>
      <form class="row" id="recon-form">
        <input id="images-input" placeholder="Images directory (HEIC/JPG)" />
        <input id="reconout-input" placeholder="Output directory (OBJ + USDZ)" />
        <button type="submit">Reconstruct</button>
      </form>
      <pre id="recon-out" class="muted"></pre>

      <h3>Measure a foot (local sidecar)</h3>
      <form class="row" id="measure-form">
        <input id="mesh-input" placeholder="/path/to/model.obj" />
        <button type="submit">Measure</button>
      </form>
      <pre id="measure-out" class="muted"></pre>

      <h3>Generate exports (local sidecar)</h3>
      <form class="row" id="exports-form">
        <input id="objdir-input" placeholder="OBJ directory (…/models/obj)" />
        <input id="outdir-input" placeholder="Output directory" />
        <button type="submit">Export</button>
      </form>
      <pre id="exports-out" class="muted"></pre>
    </main>
  </body>
</html>
