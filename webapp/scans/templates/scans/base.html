<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GOTTA.SCAN{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; background: light-dark(#f5f7f9, #0e1620); color: light-dark(#16222e, #e8eef3); }
    header { padding: 16px 24px; background: #0b1622; color: #f4f8fa; display: flex; align-items: baseline; gap: 12px; }
    header a { color: inherit; text-decoration: none; font-weight: 700; letter-spacing: 0.5px; }
    header .accent { color: #3fd8c2; }
    main { max-width: 960px; margin: 0 auto; padding: 24px; }
    .card { background: light-dark(#ffffff, #16222e); border-radius: 10px; padding: 16px 20px; margin-bottom: 14px; box-shadow: 0 1px 3px rgb(0 0 0 / 12%); }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
    .badge.uploaded, .badge.queued { background: #f3c14b33; color: #b07d0a; }
    .badge.processing { background: #4fa3ff33; color: #2c7bd4; }
    .badge.complete { background: #3fd8c233; color: #1c8f7d; }
    .badge.failed { background: #ff5d5d33; color: #cc3b3b; }
    .muted { color: light-dark(#5b6b78, #93a4b2); font-size: 14px; }
    .thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
    .thumbs img { width: 110px; height: 110px; object-fit: cover; border-radius: 6px; }
    a.button { display: inline-block; background: #3fd8c2; color: #0b1622; font-weight: 600; padding: 8px 16px; border-radius: 8px; text-decoration: none; }
    pre { white-space: pre-wrap; font-size: 12px; background: light-dark(#eef2f5, #0b1622); padding: 12px; border-radius: 8px; max-height: 300px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; }
    td, th { text-align: left; padding: 8px 10px; border-bottom: 1px solid light-dark(#e3e9ee, #22303d); }
    tr:hover td { background: light-dark(#f0f4f7, #1a2836); }
    td a { color: inherit; text-decoration: none; display: block; }
  </style>
</head>
<body>
  <header><a href="{% url 'scans:list' %}">GOTTA<span class="accent">.SCAN</span></a><span class="muted">scan pipeline</span></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
