name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  webapp:
    name: webapp (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: webapp/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python manage.py test --verbosity=2
